name: Build Onyx Aimkill APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Native Libraries with NDK
        run: |
          NDK_DIR=$(find $ANDROID_SDK_ROOT/ndk -maxdepth 1 -name "21.*" | head -n 1)
          if [ -z "$NDK_DIR" ]; then
            NDK_DIR=$(find $ANDROID_SDK_ROOT/ndk -maxdepth 1 -name "23.*" -o -name "25.*" -o -name "26.*" | head -n 1)
          fi
          if [ -z "$NDK_DIR" ]; then
            NDK_DIR=$(find $ANDROID_SDK_ROOT/ndk -maxdepth 1 -mindepth 1 | head -n 1)
          fi
          echo "Using NDK: $NDK_DIR"
          "$NDK_DIR/ndk-build" -j$(nproc) -C app/src/main/jni
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          cp -fv app/src/main/jni/libs/armeabi-v7a/*.so app/src/main/jniLibs/armeabi-v7a/ 2>/dev/null || true
          cp -fv app/src/main/libs/armeabi-v7a/*.so app/src/main/jniLibs/armeabi-v7a/ 2>/dev/null || true
          ls -la app/src/main/jniLibs/armeabi-v7a/

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon --parallel

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Onyx-Aimkill-APK
          path: app/build/outputs/apk/**/*.apk
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Onyx Aimkill Build #${{ github.run_number }}
          files: app/build/outputs/apk/**/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
